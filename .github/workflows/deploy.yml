# Build no GitHub → imagem no GHCR → VPS baixa e reinicia só o serviço agendamo via SSH.
# Configuração no GitHub (Settings → Secrets and variables → Actions):
#   Variables: NEXT_PUBLIC_APP_URL, NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_VAPID_PUBLIC_KEY,
#              NEXT_PUBLIC_SENTRY_DSN, NEXT_PUBLIC_CONTACT_EMAIL, NEXT_PUBLIC_PRICE_TEST_CENTS,
#              SENTRY_ORG, SENTRY_PROJECT
#   Secrets:   NEXT_PUBLIC_SUPABASE_ANON_KEY, SENTRY_AUTH_TOKEN, VPS_HOST, VPS_USER, VPS_SSH_KEY
# Detalhes em DEPLOY-VPS.md.

name: Build e deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache do Next
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('package-lock.json') }}-

      - run: npm ci

      - name: Build do Next
        run: npm run build
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=6144
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
          NEXT_PUBLIC_PRICE_TEST_CENTS: ${{ vars.NEXT_PUBLIC_PRICE_TEST_CENTS }}
          # Upload dos source maps (o Sentry pula sozinho se faltar algum)
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nome da imagem (minúsculo)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          # Magalu é x86
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}

      # Enquanto VPS_HOST não estiver cadastrado, o workflow só publica a imagem.
      # Só mexe no serviço agendamo: o topsites e o Caddy ficam como estão.
      - name: Atualizar a VPS
        if: ${{ env.VPS_HOST != '' }}
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd /opt/apps
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull agendamo
            docker compose up -d agendamo
            docker logout ghcr.io
            docker image prune -f
